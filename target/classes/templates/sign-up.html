<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрация</title>
  <link rel="stylesheet" href="/js/css/auth.css">
  <script src="/js/interceptor.js"></script>
</head>
<body>
<div class="card">
  <h2>Регистрация</h2>
  <div id="error" class="error"></div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="user@example.com">
  </div>
  <div class="field">
    <label>Пароль</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>
  <div class="field">
    <label>Повторите пароль</label>
    <input type="password" id="confirm" placeholder="••••••••">
  </div>

  <button id="btn">Зарегистрироваться</button>

  <div class="links">
    Есть аккаунт? <a href="/auth/sign-in">Войти</a>
  </div>
</div>
<script src="/js/auth.js"></script>
</body>
</html>
