<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль | BankCards</title>
  <script src="/js/interceptor.js"></script>
  <link rel="stylesheet" href="/js/css/profile.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-inner">
      <div class="logo">BankCards</div>
      <nav class="nav">
        <button id="btn-logout" class="btn btn-outline btn-sm">Выйти</button>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="profile-wrapper">
      <div class="profile-card">
        <div class="avatar">
          <span class="avatar-text" id="avatar-text">U</span>
        </div>

        <h1 class="profile-name" id="profile-name">Загрузка...</h1>
        <span class="profile-role" id="profile-role">—</span>

        <div class="info-list">
          <div class="info-row">
            <span class="info-label">Email</span>
            <span class="info-value" id="p-email">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">Телефон</span>
            <span class="info-value" id="p-phone">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">Telegram</span>
            <span class="info-value" id="p-tg">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">Язык</span>
            <span class="info-value" id="p-locale">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">ID</span>
            <span class="info-value info-mono" id="p-user-id">—</span>
          </div>
        </div>

        <div class="action-list">
          <button id="btn-my-cards" class="btn btn-primary btn-lg">Мои карты</button>
          <button id="btn-admin" class="btn btn-secondary btn-lg" style="display:none;">Админ-панель</button>
          <button class="btn btn-ghost" id="btn-settings">Настройки</button>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/js/profile.js"></script>
</body>
</html>
