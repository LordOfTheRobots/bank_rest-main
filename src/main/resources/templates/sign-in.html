<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" href="/js/css/auth.css">
    <script src="/js/interceptor.js"></script>
</head>
<body>
<div class="card">
    <h2>Вход</h2>
    <div id="error" class="error"></div>

    <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="user@example.com">
    </div>
    <div class="field">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <button id="btn">Войти</button>

    <div class="links">
        Нет аккаунта? <a href="/auth/sign-up">Регистрация</a>
    </div>
</div>
<script src="/js/auth.js"></script>
</body>
</html>
